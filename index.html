
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis pour les « Bollés » — Cartes</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:#f5f6fa;margin:0;padding:20px}
    .container{max-width:960px;margin:0 auto}
    h1{font-size:1.5rem;margin:0 0 10px}
    .tabs{display:flex;gap:8px;margin:10px 0 14px}
    .tab{padding:6px 12px;border:1px solid #dcdfe6;background:#fff;border-radius:999px;cursor:pointer}
    .tab.active{background:#111;color:#fff;border-color:#111}
    input[type="search"]{width:100%;padding:10px 12px;border:1px solid #cfd3dc;border-radius:10px;margin:8px 0 16px}
    .card{background:#fff;border:1px solid #e8ebf0;border-radius:12px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .title{font-weight:700;margin-bottom:6px}
    .muted{color:#666}
    .q,.r{margin:6px 0}
    .footer{color:#666;font-size:.9rem;margin-top:16px}
    .rich sup{font-size: 0.85em; vertical-align: super;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Tennis pour les « Bollés »</h1>
    <div class="tabs">
      <button class="tab active" data-kind="categories">Catégories</button>
      <button class="tab" data-kind="bris">Bris d’égalité</button>
    </div>
    <input id="search" type="search" placeholder="Mot-clé ou numéro (ex. 152)" />
    <div id="cards"></div>
    <div class="footer">Tapez un numéro exact pour accéder directement à une carte (ex. 601), ou un mot-clé (ex. « papyrus », « tie-break »).</div>
  </div>

  <script>
    const state = { kind: "categories", data: { categories: [], bris: [] } };

    function normalize(s){
      return (s || "")
        .toString()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .trim();
    }

    async function load(){
      try {
        const res = await fetch("data.json");
        const data = await res.json();
        state.data = data;
        render();
      } catch (e){
        document.getElementById("cards").innerHTML = "<p>Impossible de charger data.json.</p>";
      }
    }

    function stripHtml(s){
      return String(s||"").replace(/<[^>]*>/g," ");
    }

    function displayCategory(cat) {
      if (!cat) return "";
      const c = cat.trim().toLowerCase();
      if (c === "ou") return "Où";   // juste ici on corrige l’accent
      return cat;                    // tout le reste reste tel quel
    }


    function render(){
      const wrap = document.getElementById("cards");
      wrap.innerHTML = "";

      const raw = document.getElementById("search").value.trim(); // <-- valeur brute
      const isDigitsOnly = /^\d+$/.test(raw);                      // <-- juste des chiffres ?
      const q = normalize(raw);                                    // valeur normalisée pr recherche texte

      const items = state.data[state.kind] || [];

      const filtered = items.filter(it => {
        if (!q) return true;

        // Cas 1: entrée = nombre pur -> match EXACT sur l'id
        if (isDigitsOnly) {
          return it.id === parseInt(raw, 10);
        }

        // Cas 2: recherche plein-texte
        const text = state.kind === "categories"
          ? `${it.categorie||""} ${stripHtml(it.question)||""} ${stripHtml(it.reponse)||""}`
          : `${stripHtml(it.affirmation)||""} ${stripHtml(it.reponse)||""}`;

        return normalize(text).includes(q);
      });

      for (const it of filtered) {
        const div = document.createElement("div");
        div.className = "card";
        if (state.kind === "categories") {
          div.innerHTML = `
            <div class="title">Carte no ${it.id} ${it.categorie ? `<span class="muted">(${displayCategory(it.categorie)})</span>`:""}</div>
            <div class="q"><strong>Question :</strong> <span class="rich qtxt"></span></div>
            <div class="r"><strong>Réponse :</strong> <span class="rich rtxt"></span></div>
          `;
          div.querySelector(".qtxt").innerHTML = it.question || "";
          div.querySelector(".rtxt").innerHTML = it.reponse || "";
        } else {
          div.innerHTML = `
            <div class="title">Bris no ${it.id}</div>
            <div class="q"><strong>Affirmation :</strong> <span class="rich qtxt"></span></div>
            <div class="r"><strong>Réponse :</strong> <span class="rich rtxt"></span></div>
          `;
          div.querySelector(".qtxt").innerHTML = it.affirmation || "";
          div.querySelector(".rtxt").innerHTML = it.reponse || "";
        }
        wrap.appendChild(div);
      }
    }


    document.getElementById("search").addEventListener("input", render);
    document.querySelectorAll(".tab").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        state.kind = btn.dataset.kind;
        render();
      });
    });

    load();
  </script>
</body>
</html>
