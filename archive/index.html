<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis pour les « Bollés »</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:#f6f6f7;margin:0;padding:20px}
    .container{max-width:960px;margin:0 auto}
    h1{font-size:1.4rem;margin:0 0 12px}
    .tabs{display:flex;gap:8px;margin:8px 0 12px}
    .tab{padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:999px;cursor:pointer}
    .tab.active{background:#000;color:#fff;border-color:#000}
    input[type="search"]{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;margin:8px 0 16px}
    .card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .title{font-weight:700;margin-bottom:6px}
    .muted{color:#666}
    .q,.r{margin:6px 0}
  </style>
</head>
<body>
  <div class="container">
    <h1>Cartes</h1>
    <div class="tabs">
      <button class="tab active" data-kind="categories">Catégories</button>
      <button class="tab" data-kind="bris">Bris d’égalité</button>
    </div>
    <input id="search" type="search" placeholder="Mot-clé ou numéro… (ex. 152)" />
    <div id="cards"></div>
  </div>

  <script>
    const state = { kind: "categories", data: { categories: [], bris: [] } };

    function normalize(s){
      return (s || "")
        .toString()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .trim();
    }

    async function load(){
      const data = await fetch("data.json").then(r=>r.json());
      state.data = data;
      render();
    }

    function render(){
      const wrap = document.getElementById("cards");
      wrap.innerHTML = "";
      const q = normalize(document.getElementById("search").value);
      const items = state.data[state.kind] || [];
      const filtered = items.filter(it=>{
        if(!q) return true;
        const isNum = /^\d+$/.test(q) && String(it.id) === q;
        const text = state.kind === "categories"
          ? `${it.categorie||""} ${it.question||""} ${it.reponse||""}`
          : `${it.affirmation||""} ${it.reponse||""}`;
        return isNum || normalize(text).includes(q);
      });

      for(const it of filtered){
        const div = document.createElement("div");
        div.className = "card";
        if(state.kind === "categories"){
          div.innerHTML = `
            <div class="title">Carte no ${it.id} ${it.categorie ? `<span class="muted">(${it.categorie})</span>`:""}</div>
            <div class="q"><strong>Q :</strong> <span class="rich qtxt"></span></div>
            <div class="r"><strong>R :</strong> <span class="rich rtxt"></span></div>
          `;
          div.querySelector(".qtxt").innerHTML = it.question || "";
          div.querySelector(".rtxt").innerHTML = it.reponse || "";
        } else {
          div.innerHTML = `
            <div class="title">Bris no ${it.id}</div>
            <div class="q"><strong>Affirmation :</strong> <span class="rich qtxt"></span></div>
            <div class="r"><strong>Réponse :</strong> <span class="rich rtxt"></span></div>
          `;
          div.querySelector(".qtxt").innerHTML = it.affirmation || "";
          div.querySelector(".rtxt").innerHTML = it.reponse || "";
        }

        wrap.appendChild(div);
      }
    }

    function escape(s){
      return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("search").addEventListener("input", render);
    document.querySelectorAll(".tab").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        state.kind = btn.dataset.kind;
        render();
      });
    });

    load();
  </script>
</body>
</html>
